name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts
          cache: true
      # Fails when Vite+, its Vite core alias, and the Vitest pins drift apart (e.g. in a Renovate PR).
      # Fix it by running `vp migrate` and committing the result
      - run: vp migrate --no-interactive && git diff --exit-code
      - run: vp check
      # Unused files, exports, and dependencies
      - run: vp exec knip
      - run: vp run build # vp pack + es-check (ES2019 guard)

  test:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [lts]
        include:
          - os: ubuntu-latest
            node: latest
    steps:
      - name: Set git to use LF
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      # GitHub-hosted runners already have Chromium's system libraries, so skip
      # `--with-deps` (it runs apt-get, which is slow and can fail on mirror outages)
      - run: vp exec playwright install chromium
      - run: vp test --coverage

  # The same suite in Playwright's Chromium on BrowserStack, the browser that integration/wpt/expectations.json is
  # recorded for. Runs on pull requests from forks fail here, as they don't get the secrets
  browserstack:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check for the BrowserStack secrets
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          missing=""
          [ -n "$BROWSERSTACK_USERNAME" ] || missing="$missing BROWSERSTACK_USERNAME"
          [ -n "$BROWSERSTACK_ACCESS_KEY" ] || missing="$missing BROWSERSTACK_ACCESS_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing BrowserStack secrets::Add the GitHub Actions secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts
          cache: true
      - uses: browserstack/github-actions/setup-env@e1ceb209003b8bf050dac07c9038347259fed39c # v1.1.0
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: BUILD_INFO
      - id: tunnel
        uses: browserstack/github-actions/setup-local@e1ceb209003b8bf050dac07c9038347259fed39c # v1.1.0
        with:
          local-testing: start
          local-identifier: random
      # Set only on this step: job-level BROWSERSTACK would make prepare (vp config) load
      # vite.config.ts and throw before setup-env exports the credentials
      - run: vp test
        env:
          BROWSERSTACK: true
      - if: always() && steps.tunnel.outcome == 'success'
        uses: browserstack/github-actions/setup-local@e1ceb209003b8bf050dac07c9038347259fed39c # v1.1.0
        with:
          local-testing: stop
